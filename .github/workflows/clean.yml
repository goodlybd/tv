name: clean-playlist
on:
  schedule: [{cron: '0 2 * * *'}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/clean.py
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "clean dead channels" && git push)
